# Phase 2.5-001: Secrets scanning CI
# Scans for leaked secrets on PR and push to main

name: Security Scan

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No additional secrets required - uses built-in GITHUB_TOKEN

      - name: Verify immutable GitHub Action pins
        run: |
          node --test scripts/verify-github-actions-pins.node-tests.mjs
          node scripts/verify-github-actions-pins.mjs

      - name: Grep for common patterns (fallback)
        if: always()
        run: |
          echo "🔍 Scanning for common secret patterns..."

          # Patterns that indicate secrets
          PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"
            "sk-ant-"
            "ghp_[a-zA-Z0-9]{36}"
            "github_pat_"
            "gho_[a-zA-Z0-9]{36}"
            "PRIVATE KEY"
            "-----BEGIN RSA"
            "-----BEGIN OPENSSH"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null \
              | grep -v node_modules \
              | grep -v ".lock" \
              | grep -v dist \
              | grep -v "test-redaction" \
              | grep -v "diagnostics.ts" \
              | grep -v "placeholder" \
              | grep -v "# pragma: allowlist secret" \
              | grep -v "example\|sample\|fake\|dummy\|test\|mock" ; then
              echo "⚠️ Potential secret found matching: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected! Please review and remove."
            exit 1
          fi

          echo "✅ No obvious secret patterns found"
