name: Build & publish Docker image

# Publishes Hermes Workspace to GitHub Container Registry (GHCR) so users
# can deploy via Coolify / Easypanel / Dokploy / any Docker host with:
#
#   image: ghcr.io/outsourc-e/hermes-workspace:latest
#
# Triggers:
#   - push to main        -> tags: latest, main, main-<sha>
#   - push a git tag v*   -> tags: <version>, <major>.<minor>, latest
#   - manual dispatch     -> tags: latest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify installed peer contracts
        run: pnpm verify:peers

      - name: Verify test network boundary
        run: pnpm verify:test-network-boundary

      - name: Verify immutable GitHub Action pins
        run: |
          node --test scripts/verify-github-actions-pins.node-tests.mjs
          node scripts/verify-github-actions-pins.mjs

      - name: Lint and type-check governed surfaces
        run: |
          pnpm lint:audit
          pnpm typecheck:audit

      - name: Run complete test suite
        run: |
          pnpm test
          pnpm test:audit

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser contracts
        run: pnpm test:e2e

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build smoke-test image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: hermes-workspace:smoke
          cache-from: type=gha

      - name: Smoke test container startup
        run: |
          set -euo pipefail

          cid=$(docker run -d \
            -p 127.0.0.1:3000:3000 \
            -e HERMES_API_URL=http://127.0.0.1:8642 \
            -e CLAUDE_PASSWORD=ci-smoke-test-password \
            hermes-workspace:smoke)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT

          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$cid")
            case "$status" in
              exited*)
                echo "Container exited before becoming healthy: $status"
                exit 1
                ;;
            esac

            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Container stayed alive and served HTTP successfully"
              exit 0
            fi

            sleep 2
          done

          echo "Container did not become ready before timeout"
          exit 1

      - name: Build & push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
